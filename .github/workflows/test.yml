name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dataset and helpers
        run: node --test tests/*.test.mjs
